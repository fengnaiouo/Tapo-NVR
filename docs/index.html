<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tapo NVR — TP-Link Tapo 攝影機監控與錄影</title>
  <meta name="description" content="Tapo NVR：免費開源的 TP-Link Tapo 攝影機監控、錄影、回放與通知軟體。Windows 桌面版與網頁版。">
  <meta property="og:title" content="Tapo NVR">
  <meta property="og:description" content="Free, open-source NVR for TP-Link Tapo cameras — live view, recording, playback, notifications.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📹</text></svg>">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12; --bg-2: #11141b; --panel: #161a23; --border: #262c38;
      --text: #e8eaf0; --muted: #949cad; --accent: #3b82f6; --accent-2: #22d3ee; --ok: #34d399;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 72px; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.65 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Microsoft YaHei", sans-serif;
    }
    a { color: var(--accent-2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { width: min(1120px, 92vw); margin: 0 auto; }
    code { background: var(--panel); border: 1px solid var(--border); padding: 1px 6px; border-radius: 5px; font-size: .88em; }

    /* 導覽列 */
    nav.top {
      position: sticky; top: 0; z-index: 10;
      background: rgba(11, 13, 18, .82); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    nav.top .wrap { display: flex; align-items: center; gap: 22px; height: 60px; }
    .brand { font-weight: 700; font-size: 18px; color: var(--text); display: flex; gap: 8px; align-items: center; }
    .brand:hover { text-decoration: none; }
    .links { display: flex; gap: 18px; margin-left: auto; }
    .links a { color: var(--muted); font-size: 14px; }
    .links a:hover { color: var(--text); text-decoration: none; }
    select.lang {
      font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
      border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
    }
    @media (max-width: 760px) { .links { display: none; } select.lang { margin-left: auto; } }

    /* 首屏 */
    header.hero { padding: 92px 0 64px; text-align: center; position: relative; overflow: hidden; }
    header.hero::before {
      content: ""; position: absolute; inset: -40% -10% auto; height: 520px; z-index: -1;
      background: radial-gradient(closest-side, rgba(59, 130, 246, .28), transparent),
                  radial-gradient(closest-side, rgba(34, 211, 238, .14), transparent) 30% 40% / 60% 60% no-repeat;
    }
    .badge { display: inline-block; font-size: 13px; color: var(--accent-2); border: 1px solid rgba(34, 211, 238, .35); border-radius: 999px; padding: 3px 12px; margin-bottom: 20px; }
    h1 { font-size: clamp(34px, 6vw, 60px); line-height: 1.12; margin: 0 0 18px; letter-spacing: -.02em; }
    h1 .grad { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { font-size: clamp(16px, 2.2vw, 20px); color: var(--muted); max-width: 720px; margin: 0 auto 34px; }
    .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 10px;
      font-weight: 600; border: 1px solid var(--border); color: var(--text); background: var(--panel);
    }
    .btn:hover { text-decoration: none; border-color: var(--accent); }
    .btn.primary { background: linear-gradient(135deg, var(--accent), #2563eb); border-color: transparent; box-shadow: 0 8px 30px rgba(59, 130, 246, .35); }
    .meta { margin-top: 14px; color: var(--muted); font-size: 13px; }

    /* 示意畫面 */
    .mock {
      margin: 56px auto 0; width: min(920px, 100%); border: 1px solid var(--border); border-radius: 14px;
      background: var(--bg-2); box-shadow: 0 30px 80px rgba(0, 0, 0, .5); overflow: hidden; text-align: left;
    }
    .mock-bar { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); align-items: center; }
    .mock-bar i { width: 11px; height: 11px; border-radius: 50%; background: #3a3f4b; }
    .mock-bar span { margin-left: 10px; font-size: 12px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px; }
    .cam {
      position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden;
      background: linear-gradient(160deg, #1d2533, #0e1219);
    }
    .cam::after {
      content: ""; position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 4px);
    }
    .cam .name { position: absolute; top: 8px; right: 10px; font-size: 12px; background: rgba(0, 0, 0, .55); padding: 1px 8px; border-radius: 5px; }
    .cam .rec { position: absolute; top: 8px; left: 10px; font-size: 11px; color: #fca5a5; display: flex; align-items: center; gap: 5px; }
    .cam .rec::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: blink 1.4s infinite; }
    .cam .scene { position: absolute; inset: 22% 18%; border-radius: 6px; opacity: .55; }
    .cam:nth-child(1) .scene { background: linear-gradient(120deg, #334155, #1e3a5f); }
    .cam:nth-child(2) .scene { background: linear-gradient(60deg, #3f3f46, #27313f); inset: 30% 10% 15% 40%; }
    .cam:nth-child(3) .scene { background: linear-gradient(200deg, #1f3b35, #22303d); inset: 18% 45% 25% 12%; }
    .cam:nth-child(4) .scene { background: linear-gradient(90deg, #2e2a3f, #1f2937); }
    .cam .motion { position: absolute; left: 38%; top: 40%; width: 18%; height: 34%; border: 2px solid var(--ok); border-radius: 4px; animation: move 6s ease-in-out infinite; }
    .timeline { margin: 0 10px 10px; height: 26px; border-radius: 6px; background: var(--panel); position: relative; overflow: hidden; }
    .timeline b { position: absolute; top: 6px; bottom: 6px; background: rgba(59, 130, 246, .55); border-radius: 3px; }
    .timeline em { position: absolute; top: 3px; bottom: 3px; width: 3px; background: #f59e0b; border-radius: 2px; }
    @keyframes blink { 50% { opacity: .2; } }
    @keyframes move { 50% { transform: translate(60%, -10%); } }

    /* 區塊 */
    section { padding: 84px 0; border-top: 1px solid var(--border); }
    section h2 { font-size: clamp(26px, 3.6vw, 36px); margin: 0 0 12px; text-align: center; letter-spacing: -.01em; }
    section .sub { color: var(--muted); text-align: center; max-width: 680px; margin: 0 auto 46px; }
    .features { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; transition: border-color .2s, transform .2s; }
    .card:hover { border-color: #3b4a66; transform: translateY(-2px); }
    .card .ico { font-size: 26px; margin-bottom: 8px; }
    .card h3 { margin: 0 0 6px; font-size: 17px; }
    .card p { margin: 0; color: var(--muted); font-size: 14.5px; }

    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; counter-reset: step; }
    .step { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px 22px 22px 66px; }
    .step::before {
      counter-increment: step; content: counter(step);
      position: absolute; left: 20px; top: 22px; width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center; font-weight: 700; background: rgba(59, 130, 246, .18); color: var(--accent);
    }
    .step h3 { margin: 0 0 6px; font-size: 16px; }
    .step p { margin: 0; color: var(--muted); font-size: 14.5px; }

    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 760px) { .two { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr 1fr; } }
    ul.check { list-style: none; padding: 0; margin: 0; }
    ul.check li { padding-left: 28px; position: relative; margin: 8px 0; color: var(--muted); font-size: 14.5px; }
    ul.check li::before { content: "✓"; position: absolute; left: 4px; color: var(--ok); font-weight: 700; }

    details { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; }
    details summary { cursor: pointer; font-weight: 600; }
    details p { color: var(--muted); margin: 10px 0 2px; font-size: 14.5px; }

    .download { text-align: center; }
    .download .box { display: inline-block; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 34px 40px; }
    .req { color: var(--muted); font-size: 13.5px; margin-top: 18px; }

    footer { border-top: 1px solid var(--border); padding: 30px 0; color: var(--muted); font-size: 13.5px; }
    footer .wrap { display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
  </style>
</head>

        if (n.startsWith('zh')) return /cn|sg|hans/.test(n) ? 'zh-CN' : 'zh-TW';
        if (n.startsWith('en')) return 'en';
      }
      return 'en';
    }

        if (release.size) document.querySelectorAll('.size').forEach((el) => el.textContent = t('sizeMB', {n: release.size}));
      }
    }
    document.getElementById('lang').onchange = (e) => {
      lang = e.target.value;
      localStorage.setItem('lang', lang);
      render();
    };

        if (exe) document.querySelectorAll('.dl-link').forEach((a) => a.href = exe.browser_download_url);
        render();
      })
