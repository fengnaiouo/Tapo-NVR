<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入 - Tapo NVR</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/i18n.js"></script>
</head>
<body class="login-page">
  <form id="login" class="login-card">
    <h1>📹 Tapo NVR</h1>
    <label>帳號<input name="username" autocomplete="username" required autofocus></label>
    <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">登入</button>
    <p id="error" class="error" hidden></p>
  </form>
  <script>
    const form = document.getElementById('login');
    const error = document.getElementById('error');
    fetch('/api/setup').then((r) => r.json()).then((s) => { if (s.needs_setup) location.href = '/setup.html'; });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.hidden = true;
      const body = Object.fromEntries(new FormData(form));
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', ...i18n.headers()},
          body: JSON.stringify(body),
        });
        if (r.ok) { location.href = '/'; return; }
        error.textContent = (await r.json()).error || t('登入失敗');
      } catch {
        error.textContent = t('無法連線伺服器');
      }
      error.hidden = false;
    });
  </script>
</body>
</html>
